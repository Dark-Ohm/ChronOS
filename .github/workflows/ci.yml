name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt (advisory)
    runs-on: ubuntu-latest
    # Advisory until the tree is formatted in a dedicated pass — does not gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  skill-proofs:
    # Every `file:line` proof reference in the skill vault (SKILL.md,
    # references/, *.eval.md) must resolve to a real file:line — stale proof
    # links are treated as defects. Run early: cheap and independent of the
    # Rust toolchain. The gpui fork (ChronOS-GPUI) is cloned as the sibling
    # `../Source` the checker expects, so fork-only references are validated
    # strictly too. Roots that cannot exist on a fresh runner degrade to
    # informational EXT: the fork if the clone fails, `reference/` (gitignored
    # donor snapshots, never committed) and `Source-wt-component/` (gpui-
    # component worktree). Committed repo roots (crates/, docs/, skills/) are
    # strict always.
    name: skill proof links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone gpui fork (best-effort, for fork-proof strictness)
        run: |
          git clone --depth 1 https://github.com/Dark-Ohm/Chronos-GPUI \
            "${GITHUB_WORKSPACE}/../Source" \
            || echo "fork clone failed — fork references degrade to informational EXT"
      - name: Validate skill proof references
        run: bash skills/check-proofs.sh

  build-test:
    name: clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # GPUI / Wayland build dependencies.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libvulkan-dev vulkan-validationlayers \
            libfontconfig-1-dev libfreetype-dev \
            libasound2-dev libdbus-1-dev pkg-config
      # unwrap_used / expect_used are workspace `warn` and cleaned incrementally,
      # so clippy is advisory rather than `-D warnings` for now.
      - name: Clippy
        run: cargo clippy --workspace --all-targets
        continue-on-error: true
      - name: Test
        run: cargo test --workspace --lib --bins
