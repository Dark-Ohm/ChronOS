[package]
name = "chronos-services"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow.workspace = true
tokio.workspace = true
futures-signals.workspace = true
futures-util.workspace = true
zbus.workspace = true
enumflags2 = "0.7"
hyprland.workspace = true
niri-ipc.workspace = true
chrono.workspace = true
notify = "8"
tracing.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sysinfo.workspace = true
nvml-wrapper.workspace = true
# NOTE: unstable_session_model (0.11.1) has been removed in 2.0.0;
# NewSessionResponse no longer carries a `models` field at all.
# Models will be handled via a separate path (T144).
#
# NOTE: unstable_session_usage → unstable_end_turn_token_usage in 2.0.0.
# Do NOT enable it "just in case": measured live on 2026-07-27 against
# hermes-agent 0.18.2 — a mid-turn `UsageUpdate { used: 78879,
# size: 1000000 }` arrives and deserializes fine without the flag. It is
# simply not handled yet (logged as an unhandled variant since T146/E5).
# Surfacing token spend is a UI task, not a feature flag.
agent-client-protocol = "2.0.0"
dirs = "6"
toml = "0.8"

[dev-dependencies]
# futures-util from workspace provides StreamExt for tests
tracing-subscriber = { workspace = true }

[lints]
workspace = true